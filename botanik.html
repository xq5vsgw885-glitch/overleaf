<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Botanik API Test</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 1100px; }
    input, button, select { font-size: 1rem; padding: .6rem; }
    input { width: 320px; }
    button { cursor: pointer; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1.5rem; }
    .card { border: 1px solid #ddd; border-radius: 10px; padding: 1rem; background: #fafafa; }
    .taxon, .feature { padding: .6rem; border-bottom: 1px solid #ddd; cursor: pointer; }
    .taxon:hover, .feature:hover { background: #eef3ff; }
    .muted { color: #666; font-size: .9rem; }
    .row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
    pre { background: #f3f3f3; padding: 1rem; overflow:auto; white-space: pre-wrap; }
    h2 { margin-top: 0; }
  </style>
</head>
<body>
  <h1>Botanik API Test</h1>

  <div class="row">
    <input id="q" value="Acer">
    <button onclick="searchTaxa()">Taxa suchen</button>

    <label class="muted">
      <input id="includeStubs" type="checkbox" onchange="searchTaxa()" style="width:auto">
      vorbereitete Taxa anzeigen
    </label>

    <select id="visibility">
      <option value="high">Sichtbarkeit: high</option>
      <option value="medium">Sichtbarkeit: medium</option>
      <option value="low">Sichtbarkeit: low</option>
    </select>

    <select id="weight">
      <option value="high">Diagnosegewicht: high</option>
      <option value="medium">Diagnosegewicht: medium</option>
      <option value="low">Diagnosegewicht: low</option>
    </select>

    <input id="featureSearch" placeholder="Merkmale filtern: Blatt, Frucht, giftig …">

    <button onclick="loadPhotoFeatures()">Foto-Merkmale anzeigen</button>
  </div>

  <div class="grid">
    <div class="card">
      <h2>Suchergebnisse / Foto-Merkmale</h2>
      <div id="results">Noch keine Abfrage.</div>
    </div>

    <div class="card">
      <h2>Taxon-Details</h2>
      <div id="details">Noch kein Taxon ausgewählt.</div>
    </div>
  </div>

  <script>
    const API_BASE = "https://overleaf-tdkd.onrender.com";

    async function searchTaxa() {
      const q = document.getElementById("q").value.trim();
      const box = document.getElementById("results");
      box.textContent = "Lade Suchergebnisse…";

      const includeStubs = document.getElementById("includeStubs").checked;
      const stubParam = includeStubs ? "&include_stubs=1" : "";
      const res = await fetch(`${API_BASE}/api/botanik/taxa?q=${encodeURIComponent(q)}${stubParam}`);
      const data = await res.json();

      if (!data.rows || data.rows.length === 0) {
        box.textContent = "Keine Treffer.";
        return;
      }

      box.innerHTML = `
        <p class="muted">Treffer: ${data.count} · vorbereitete Taxa: ${data.include_stubs ? "ein" : "aus"}</p>
        ${data.rows.map(row => `
          <div class="taxon" onclick="loadTaxon(${row.taxon_id})">
            <strong>${escapeHtml(row.scientific_name || "")}</strong><br>
            <span class="muted">${escapeHtml(row.german_name || "")} · ${escapeHtml(row.rank || "")} · Status: ${escapeHtml(row.status || "")} · ${escapeHtml(row.taxon_id || "")}</span>
          </div>
        `).join("")}
      `;
    }

    async function loadTaxon(taxonId) {
      const box = document.getElementById("details");
      box.textContent = "Lade Details…";

      const res = await fetch(`${API_BASE}/api/botanik/taxon/${encodeURIComponent(taxonId)}`);
      const data = await res.json();

      if (!res.ok) {
        box.textContent = JSON.stringify(data, null, 2);
        return;
      }

      const t = data.taxon;
      const features = data.features || [];

      box.innerHTML = `
        <h3>${escapeHtml(t.scientific_name || "")}</h3>
        <p><strong>Deutsch:</strong> ${escapeHtml(t.german_name || "")}</p>
        <p><strong>Rang:</strong> ${escapeHtml(t.rank || "")}</p>
        <p><strong>Familie:</strong> ${escapeHtml(t.family || "")}</p>
        <p><strong>Quelle:</strong> ${escapeHtml(t.source_pdf || "")}</p>
        <p><strong>Merkmale:</strong> ${features.length}</p>
        ${features.length ? `
          <ul>
            ${features.map(f => `
              <li>
                <strong>${escapeHtml(f.character || "")}</strong>:
                ${escapeHtml(f.state || "")}
                <br><span class="muted">Organ: ${escapeHtml(f.organ || "")}; diagnostisches Gewicht: ${escapeHtml(f.diagnostic_weight || "")}</span>
              </li>
            `).join("")}
          </ul>
        ` : `<p class="muted">Für dieses Taxon sind noch keine Merkmale hinterlegt.</p>`}
      `;
    }

    async function loadPhotoFeatures() {
      const box = document.getElementById("results");
      box.textContent = "Lade foto-diagnostische Merkmale…";

      const visibility = document.getElementById("visibility").value;
      const weight = document.getElementById("weight").value;
      const term = document.getElementById("featureSearch").value.trim().toLowerCase();

      const res = await fetch(`${API_BASE}/api/botanik/features/photo?visibility=${encodeURIComponent(visibility)}&weight=${encodeURIComponent(weight)}`);
      const data = await res.json();

      let rows = data.rows || [];
      if (term) {
        rows = rows.filter(f => [
          f.scientific_name, f.german_name, f.character, f.state, f.organ,
          f.feature_group, f.taxon_id, f.source_note
        ].join(" ").toLowerCase().includes(term));
      }

      if (!rows.length) {
        box.textContent = "Keine passenden foto-diagnostischen Merkmale gefunden.";
        return;
      }

      box.innerHTML = `
        <p class="muted">Filter: visibility=${escapeHtml(data.filters.visibility)}, weight=${escapeHtml(data.filters.weight)} · Treffer: ${rows.length} von ${data.count}</p>
        ${rows.map(f => `
          <div class="feature" onclick="loadTaxon('${f.taxon_id}')">
            <strong>${escapeHtml(f.scientific_name || f.taxon_id)}</strong><br>
            ${escapeHtml(f.character || "")}: ${escapeHtml(f.state || "")}
            <br><span class="muted">${escapeHtml(f.german_name || "")} · Organ: ${escapeHtml(f.organ || "")} · ${escapeHtml(f.taxon_id || "")}</span>
          </div>
        `).join("")}
      `;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      }[c]));
    }

    searchTaxa();
  </script>
</body>
</html>
