[pytest]
testpaths = .
python_files = test_audit.py test_hooks.py test_legacy_suites.py
# test_chunker.py und test_acceptance.py sind eigenstaendige Pruefskripte
# ohne test_-Funktionen; sie laufen ueber test_legacy_suites.py als
# Unterprozess und werden hier bewusst nicht eingesammelt.
addopts = -q
